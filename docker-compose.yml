services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: local-synthetic-only
    ports: ['127.0.0.1:5432:5432']
    volumes: ['atlas-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas']
      interval: 5s
      retries: 10
volumes:
  atlas-db:
